<script>
'use strict';

/* ------------------------------------------------------------------ */

/* ------------------------------------------------------------------ */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const enc = encodeURIComponent;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const normTxt = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const hue = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.codePointAt(0)) >>> 0; return h % 360; };
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const extOf = n => { const i = n.lastIndexOf('.'); return i > 0 ? n.slice(i).toLowerCase() : ''; };
const dirOf = p => p.includes('/') ? p.slice(0, p.lastIndexOf('/')) : '';
const fileUrl = (p, dl) => `/api/file?path=${enc(p)}${dl ? '&download=1' : ''}`;

function fmtSize(b) {
  if (b == null) return '';
  const u = ['B', 'KB', 'MB', 'GB', 'TB']; let i = 0;
  while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
  return `${b < 10 && i ? b.toFixed(1) : Math.round(b)} ${u[i]}`;
}
function fmtTime(s) {
  s = Math.max(0, Math.floor(s || 0));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = String(s % 60).padStart(2, '0');
  return h ? `${h}:${String(m).padStart(2, '0')}:${ss}` : `${m}:${ss}`;
}
function fmtLong(s) {
  const m = Math.round(s / 60);
  return m < 60 ? `${Math.max(m, 1)} min` : `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, '0')}min`;
}
function joinPath(base, rel) {
  const out = base ? base.split('/') : [];
  for (let seg of rel.split(/[?#]/)[0].split('/')) {
    try { seg = decodeURIComponent(seg); } catch {}
    if (!seg || seg === '.') continue;
    if (seg === '..') out.pop(); else out.push(seg);
  }
  return out.join('/');
}
function hashFor(path, params) {
  const seg = (path || '').split('/').filter(Boolean).map(enc).join('/');
  const qs = params && Object.keys(params).length ? '?' + new URLSearchParams(params) : '';
  return '#/' + seg + qs;
}
function parseHash() {
  const raw = location.hash.replace(/^#\/?/, '');
  const i = raw.indexOf('?');
  const p = i >= 0 ? raw.slice(0, i) : raw;
  const path = p.split('/').filter(Boolean).map(s => { try { return decodeURIComponent(s); } catch { return s; } }).join('/');
  return { path, params: new URLSearchParams(i >= 0 ? raw.slice(i + 1) : '') };
}
function go(path, params) {
  const h = hashFor(path, params);
  if (location.hash === h) route(); else location.hash = h;
}
async function api(url, opts = {}) {
  const r = await fetch(url, { ...opts, headers: { 'X-Lang': LANG, ...(opts.headers || {}) } });
  if (r.status === 401) { location.reload(); return new Promise(() => {}); }  // sessão expirou: tela de login
  if (!r.ok) {
    let msg = `${r.status} ${r.statusText}`, data = null;
    try { data = await r.json(); if (typeof data.detail === 'string') msg = data.detail; } catch {}
    throw Object.assign(new Error(msg), { data });
  }
  return r.json();
}
const postJSON = (url, body) => api(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.remove('opacity-0', 'translate-y-2');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.add('opacity-0', 'translate-y-2'), 2400);
}
function hl(text, q) {
  text = String(text ?? '');
  const terms = normTxt(q || '').split(/\s+/).filter(Boolean);
  if (!terms.length) return esc(text);
  let norm = ''; const map = [];
  for (let i = 0; i < text.length; i++) {
    const n = normTxt(text[i]);
    for (let k = 0; k < n.length; k++) { norm += n[k]; map.push(i); }
  }
  const marks = new Array(text.length).fill(false);
  for (const t of terms) {
    for (let idx = norm.indexOf(t); idx !== -1; idx = norm.indexOf(t, idx + t.length))
      for (let k = idx; k < idx + t.length; k++) marks[map[k]] = true;
  }
  let out = '', open = false;
  for (let i = 0; i < text.length; i++) {
    if (marks[i] !== open) { out += marks[i] ? '<mark>' : '</mark>'; open = marks[i]; }
    out += esc(text[i]);
  }
  return open ? out + '</mark>' : out;
}

// Renomear/mover muda os caminhos: leva junto progresso, posição, favoritos e "continuar".
function migratePaths(moved) {
  if (!moved || !moved.length) return;
  const remap = p => {
    for (const { from, to } of moved) {
      if (p === from) return to;
      if (p.startsWith(from + '/')) return to + p.slice(from.length);
    }
    return p;
  };
  for (const obj of [watched, positions, favs]) {
    for (const k of Object.keys(obj)) {
      const n = remap(k);
      if (n !== k) { obj[n] = obj[k]; delete obj[k]; }
    }
  }
  store.set('watched', watched); store.set('pos', positions); store.set('favs', favs);
  const last = store.get('last', null);
  if (last && last.path) {
    const path = remap(last.path), folder = remap(last.folder || '');
    if (path !== last.path || folder !== last.folder) store.set('last', { ...last, path, folder });
  }
}

function watchedCount(prefix) {
  if (!prefix) return Object.keys(watched).length;
  const p = prefix + '/'; let n = 0;
  for (const k in watched) if (k.startsWith(p)) n++;
  return n;
}
function progress(prefix, total) {
  if (!total) return { done: 0, total: 0, pct: 0 };
  const done = Math.min(watchedCount(prefix), total);
  return { done, total, pct: Math.round(done / total * 100) };
}
const progText = p => t('prog', p);
function setWatched(path, val) {
  if (val) watched[path] = Date.now(); else delete watched[path];
  store.set('watched', watched);
  refreshProgressUI();
}
function savePos(path, t, dur) {
  if (!t || t < 5) return;
  if (dur && t > dur - 15) delete positions[path]; else positions[path] = Math.floor(t);
  store.set('pos', positions);
}
function progBar(prefix, total, cls = 'h-1') {
  const p = progress(prefix, total);
  return `<div class="${cls} rounded-full bg-white/[.06] overflow-hidden" data-prog="${esc(prefix)}" data-total="${total}">
    <div class="h-full rounded-full bg-gradient-to-r from-accent-deep to-accent-soft transition-all duration-500" style="width:${p.pct}%"></div></div>`;
}
function toggleFav(path) {
  if (favs[path]) delete favs[path]; else favs[path] = Date.now();
  store.set('favs', favs);
  toast(t(favs[path] ? 'fav_added' : 'fav_removed'));
  if (S.playing === -1 && S.data) { const y = window.scrollY; renderView(S.data); window.scrollTo(0, y); return; }
  // com um vídeo aberto, só atualiza as estrelas (re-renderizar derrubaria o player)
  $$('[data-fav]').filter(el => el.dataset.fav === path).forEach(el => {
    el.classList.toggle('is-fav', !!favs[path]);
    el.title = t(favs[path] ? 'fav_remove' : 'fav_add');
    el.setAttribute('aria-pressed', String(!!favs[path]));
  });
}
function refreshProgressUI() {
  $$('[data-prog]').forEach(el => { el.firstElementChild.style.width = progress(el.dataset.prog, +el.dataset.total).pct + '%'; });
  $$('[data-prog-label]').forEach(el => { el.textContent = progText(progress(el.dataset.progLabel, +el.dataset.total)); });
  $$('[data-watch]').forEach(el => el.classList.toggle('is-watched', !!watched[el.dataset.watch]));
}

function initials(t) {
  const w = String(t).replace(/[^\p{L}\p{N}\s]/gu, ' ').split(/\s+/).filter(x => x && !/^\d+$/.test(x));
  return (w.slice(0, 2).map(x => x[0]).join('') || '•').toUpperCase();
}
function dirLabel(x) {
  return x.conf && x.conf.title ? { num: null, text: x.conf.title } : { num: x.num, text: x.num ? x.clean : x.name };
}
function cover(item, { monogram = true } = {}) {
  const conf = item.conf || {}, t = item.title || item.name || '', h = hue(t);
  const bg = conf.color
    ? `background:linear-gradient(135deg, ${conf.color}, #0f0f11 85%)`
    : `background:radial-gradient(120% 120% at 0% 0%, hsl(${h} 42% 24% / .95), transparent 60%),
       radial-gradient(100% 100% at 100% 100%, hsl(${(h + 55) % 360} 38% 18% / .85), transparent 55%), #141416`;
  return `<div class="absolute inset-0" style="${esc(bg)}">
      <div class="absolute inset-0 cover-grid"></div>
      ${monogram ? `<span class="absolute inset-0 grid place-items-center text-5xl font-bold tracking-tight text-white/[.08] select-none">${esc(initials(item.clean || t))}</span>` : ''}
      ${conf.banner ? `<img src="${esc(conf.banner)}" alt="" loading="lazy" decoding="async" class="absolute inset-0 w-full h-full object-cover" style="${bannerPos(conf)}" onerror="this.remove()">` : ''}
    </div>`;
}
const bannerPos = conf => `object-position:50% ${conf.banner_pos ?? 50}%`;
function favBtn(path, cls = '', iconCls = 'w-3.5 h-3.5', hover = false) {
  const on = isFav(path);
  return `<button type="button" class="fav inline-grid place-items-center shrink-0 rounded-full ${on ? 'is-fav' : ''} ${cls}" data-fav="${esc(path)}"${hover ? ' data-hover' : ''}
    title="${t(on ? 'fav_remove' : 'fav_add')}" aria-pressed="${on}">${icon('star', iconCls + ' fav-off')}${icon('starFill', iconCls + ' fav-on')}</button>`;
}
// <span role=button>: pode ficar dentro de <a>/<button> (cards, tiles de imagem) sem quebrar o HTML.
function kebab(path, cls = '', hover = true) {
  if (!canWrite()) return '';
  return `<span role="button" tabindex="0" aria-haspopup="menu" title="${t('more')}" data-menu="${esc(path)}"${hover ? ' data-hover' : ''}
    class="kebab inline-grid place-items-center shrink-0 ${cls}">${icon('dots', 'w-4 h-4')}</span>`;
}
const selbox = () => canWrite()
  ? `<span class="selbox place-items-center w-5 h-5 shrink-0 rounded-md border border-zinc-500 bg-ink-900/80 text-transparent" aria-hidden="true">${icon('check', 'w-3 h-3')}</span>`
  : '';
const selAttr = path => canWrite() ? ` data-sel="${esc(path)}"` : '';
function tagChip(t, count) {
  return `<button type="button" data-tag="${esc(t)}" class="tag ${S.activeTags.has(t) ? 'is-active' : ''}" style="--h:${hue(t)}">
    ${esc(t)}${count != null ? `<span class="ml-1.5 opacity-60">${count}</span>` : ''}</button>`;
}
function metaLine(st, cls = 'text-xs', durKey = null) {
  const parts = [];
  if (st.media) parts.push(['film', pl(st.media, 'u_lesson')]);
  if (st.docs) parts.push(['file', pl(st.docs, 'u_material')]);
  if (st.dirs) parts.push(['folder', pl(st.dirs, 'u_folder')]);
  const rest = st.files - st.media - st.docs;
  if (!parts.length) parts.push(['box', rest > 0 ? pl(rest, 'u_file') : t('empty_short')]);
  // a duração total chega depois (paintDurations), só quando todos os vídeos já foram medidos
  const dur = durKey != null ? `<span class="hidden inline-flex items-center gap-1" data-dur-dir="${esc(durKey)}" title="${t('dur_total')}"></span>` : '';
  return `<div class="flex flex-wrap gap-x-3 gap-y-1 ${cls} text-zinc-500">${parts.map(([i, t]) =>
    `<span class="inline-flex items-center gap-1">${icon(i, 'w-3.5 h-3.5')}${t}</span>`).join('')}${dur}</div>`;
}
function statusChip(conf, p) {
  let label, color;
  if (conf.status) { label = conf.status; color = 'bg-accent/20 text-accent-soft border-accent/30'; }
  else if (!p.total) return '';
  else if (p.pct >= 100) { label = t('st_done'); color = 'bg-emerald-500/15 text-emerald-300 border-emerald-400/30'; }
  else if (p.done > 0) { label = t('st_progress', p); color = 'bg-amber-500/15 text-amber-200 border-amber-400/30'; }
  else { label = t('st_new'); color = 'bg-black/40 text-zinc-300 border-white/10'; }
  return `<span class="inline-flex items-center gap-1.5 rounded-full border px-2 py-0.5 text-[10px] font-semibold backdrop-blur ${color}">
    <span class="w-1.5 h-1.5 rounded-full bg-current"></span>${esc(label)}</span>`;
}

function courseCard(d) {
  const c = d.conf, st = d.stats, p = progress(d.path, st.media);
  return `<article class="card group" data-nav="${esc(d.path)}"${selAttr(d.path)} tabindex="0">
    <div class="relative aspect-[16/8] overflow-hidden">
      ${cover(d)}
      <div class="absolute inset-0 bg-gradient-to-t from-ink-850 via-transparent to-transparent"></div>
      <div class="absolute top-3 left-3 right-3 flex justify-between items-start gap-2">
        <div class="flex items-center gap-1.5">
          ${selbox()}
          ${favBtn(d.path, 'w-7 h-7 bg-black/50 backdrop-blur hover:bg-black/70', 'w-3.5 h-3.5', true)}
          ${c.pinned ? `<span class="inline-grid place-items-center w-6 h-6 rounded-full bg-black/50 text-accent-soft backdrop-blur" title="${t('pinned')}">${icon('pin', 'w-3.5 h-3.5')}</span>` : ''}
        </div>
        <div class="flex items-center gap-1.5">
          ${statusChip(c, p)}
          ${kebab(d.path, 'w-7 h-7 rounded-full bg-black/50 backdrop-blur hover:bg-black/70')}
        </div>
      </div>
    </div>
    <div class="flex flex-1 flex-col gap-3 p-4 pt-3">
      <div>
        <h3 class="text-[15px] font-semibold leading-snug text-zinc-100 group-hover:text-white line-clamp-2">
          <a href="${hashFor(d.path)}" tabindex="-1">${esc(d.title)}</a></h3>
        ${c.description ? `<p class="mt-1 text-[13px] leading-relaxed text-zinc-400 line-clamp-2">${esc(c.description)}</p>` : ''}
      </div>
      ${metaLine(st, 'text-xs', d.path)}
      ${c.tags.length ? `<div class="flex flex-wrap gap-1.5">${c.tags.map(t => tagChip(t)).join('')}</div>` : ''}
      ${st.media ? `<div class="mt-auto pt-1">${progBar(d.path, st.media)}</div>` : ''}
    </div>
  </article>`;
}

function moduleCard(d, i) {
  const st = d.stats, lab = dirLabel(d), h = hue(d.title);
  const thumb = d.conf.banner
    ? `<img src="${esc(d.conf.banner)}" alt="" loading="lazy" class="w-12 h-12 rounded-lg object-cover shrink-0" style="${bannerPos(d.conf)}" onerror="this.style.visibility='hidden'">`
    : `<span class="grid place-items-center w-12 h-12 rounded-lg shrink-0 font-mono text-sm font-semibold"
         style="color:hsl(${h} 70% 78%);background:hsl(${h} 45% 45% / .14);border:1px solid hsl(${h} 50% 60% / .2)">
         ${lab.num ? esc(lab.num) : icon('folder', 'w-5 h-5')}</span>`;
  return `<a href="${hashFor(d.path)}"${selAttr(d.path)} class="group flex items-center gap-3 p-3 rounded-xl border border-ink-700 bg-ink-850 hover:border-accent/50 hover:bg-ink-800 transition">
    ${selbox()}${thumb}
    <div class="min-w-0 flex-1">
      <div class="flex items-center gap-1.5">
        ${d.conf.pinned ? `<span class="text-accent-soft">${icon('pin', 'w-3 h-3')}</span>` : ''}
        <span class="truncate text-sm font-medium text-zinc-200 group-hover:text-white" title="${esc(d.name)}">${esc(lab.text)}</span>
      </div>
      ${metaLine(st, 'text-[11px] mt-0.5', d.path)}
      ${st.media ? progBar(d.path, st.media, 'h-[3px] mt-2') : ''}
    </div>
    ${kebab(d.path, 'w-7 h-7 rounded-full hover:bg-ink-700')}
    ${favBtn(d.path, 'w-7 h-7 hover:bg-ink-700', 'w-3.5 h-3.5', true)}
    <span class="text-zinc-600 group-hover:text-zinc-300 transition">${icon('chevron')}</span>
  </a>`;
}

function lessonRow(m, i) {
  const pos = positions[m.path];
  return `<div class="lesson ${watched[m.path] ? 'is-watched' : ''}" data-row="${i}" data-watch="${esc(m.path)}"${selAttr(m.path)}>
    <div class="group flex items-center gap-3 px-3 sm:px-4 py-2.5 hover:bg-white/[.02]">
      ${selbox()}
      <button class="check" data-action="toggle-watched" data-i="${i}" title="${t('mark_watched')}">${icon('check', 'w-3 h-3')}</button>
      <button class="flex flex-1 min-w-0 items-center gap-3 text-left" data-action="play" data-i="${i}">
        <span class="lesson-num">${esc(m.num || String(i + 1).padStart(2, '0'))}</span>
        ${m.kind === 'video' && media().thumbs ? `<img src="/api/thumb?path=${enc(m.path)}" alt="" loading="lazy" decoding="async"
          class="hidden sm:block w-[72px] aspect-video shrink-0 rounded bg-ink-800 object-cover" onerror="this.remove()">` : ''}
        <span class="lesson-title truncate text-sm text-zinc-200" title="${esc(m.name)}">${esc(m.title)}</span>
      </button>
      <span class="hidden sm:flex items-center gap-2 shrink-0 text-[11px] text-zinc-500">
        ${pos ? `<span class="inline-flex items-center gap-1 text-accent-soft/80" title="${t('stopped_at')}">${icon('clock', 'w-3 h-3')}${fmtTime(pos)}</span>` : ''}
        ${m.subtitles.length ? `<span class="badge" title="${t('subs_avail')}">CC</span>` : ''}
        <span class="badge">${esc(m.ext.slice(1))}</span>
        <span class="w-14 text-right tabular-nums text-zinc-400" data-dur="${esc(m.path)}"></span>
        <span class="w-16 text-right tabular-nums">${fmtSize(m.size)}</span>
      </span>
      ${kebab(m.path, 'w-8 h-8 rounded-md hover:bg-ink-700')}
      <button class="ibtn text-zinc-300" data-action="play" data-i="${i}" title="${t('play')}">${icon(m.kind === 'audio' ? 'music' : 'play', 'w-4 h-4')}</button>
    </div>
  </div>`;
}

function fileIcon(f) {
  if (f.kind === 'image') return 'image';
  if (f.kind === 'video') return 'film';
  if (f.kind === 'audio') return 'music';
  if (f.ext === '.pdf') return 'file';
  if (f.text) return ['.txt', '.md', '.markdown', '.rst', '.log', '.csv', ''].includes(f.ext) ? 'file' : 'code';
  return 'box';
}
function fileTile(f, list, i) {
  const ext = (f.ext || '').slice(1) || 'txt';
  return `<div class="group flex items-center gap-3 p-3 rounded-xl border border-ink-700 bg-ink-850 hover:border-accent/50 hover:bg-ink-800 transition cursor-pointer"
               data-action="preview" data-list="${list}" data-i="${i}"${selAttr(f.path)} title="${esc(f.name)}">
    ${selbox()}
    <span class="ficon grid place-items-center w-10 h-10 rounded-lg shrink-0" style="--h:${hue(ext) }">${icon(fileIcon(f), 'w-5 h-5')}</span>
    <div class="min-w-0 flex-1">
      <div class="truncate text-sm text-zinc-200 group-hover:text-white">${esc(f.name)}</div>
      <div class="text-[11px] text-zinc-500 uppercase tracking-wide">${esc(ext)} · ${fmtSize(f.size)}</div>
    </div>
    <div class="flex items-center opacity-70 group-hover:opacity-100 transition">
      <a class="ibtn" href="${fileUrl(f.path)}" target="_blank" rel="noopener" title="${t('open_tab')}">${icon('external')}</a>
      <a class="ibtn" href="${fileUrl(f.path, 1)}" title="${t('download')}">${icon('download')}</a>
      ${kebab(f.path, 'w-8 h-8 rounded-md hover:bg-ink-700', false)}
    </div>
  </div>`;
}

function section(iconName, title, count, inner, extra = '') {
  return `<section class="mb-10">
    <div class="flex flex-wrap items-center justify-between gap-3 mb-3">
      <h2 class="section-title">${icon(iconName, 'w-3.5 h-3.5')}${title}<span class="count">${count}</span></h2>${extra}
    </div>${inner}</section>`;
}

function fileSections(d) {
  let html = '';
  if (d.media.length) {
    const tools = `<div class="flex items-center gap-2 text-xs text-zinc-400">
      <label class="inline-flex items-center gap-2 cursor-pointer select-none mr-2">
        <input type="checkbox" data-action="autoplay" class="accent-[#8b7cf6]" ${prefs.autoplay ? 'checked' : ''}> ${t('autoplay')}
      </label>
      <button class="btn" data-action="mark-all">${icon('check', 'w-3.5 h-3.5')} ${t('mark_all')}</button></div>`;
    html += section('film', t('s_lessons'), d.media.length,
      `<div class="rounded-xl border border-ink-700 bg-ink-850 divide-y divide-ink-700/70 overflow-hidden">${d.media.map(lessonRow).join('')}</div>`, tools);
  }
  if (d.docs.length) html += section('book', t('s_materials'), d.docs.length,
    `<div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">${d.docs.map((f, i) => fileTile(f, 'docs', i)).join('')}</div>`);
  if (d.images.length) html += section('image', t('s_images'), d.images.length,
    `<div class="grid gap-3 grid-cols-2 sm:grid-cols-3 lg:grid-cols-5">${d.images.map((f, i) =>
      `<button class="group relative aspect-video rounded-lg overflow-hidden border border-ink-700 bg-ink-850 hover:border-accent/50" data-action="preview" data-list="images" data-i="${i}"${selAttr(f.path)} title="${esc(f.name)}">
        <img src="${fileUrl(f.path)}" alt="" loading="lazy" decoding="async" class="w-full h-full object-cover group-hover:scale-[1.03] transition duration-300">
        <span class="absolute inset-x-0 bottom-0 truncate bg-gradient-to-t from-black/80 px-2 pb-1.5 pt-4 text-left text-[11px] text-zinc-200">${esc(f.name)}</span>
        <span class="absolute top-2 left-2">${selbox()}</span>
        <span class="absolute top-1.5 right-1.5">${kebab(f.path, 'w-7 h-7 rounded-full bg-black/60 text-zinc-200 hover:bg-black/80')}</span>
      </button>`).join('')}</div>`);
  if (d.others.length) html += section('box', t('s_others'), d.others.length,
    `<div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">${d.others.map((f, i) => fileTile(f, 'others', i)).join('')}</div>`);
  return html;
}

/* ------------------------------------------------------------------ */
/* Views                                                                */
/* ------------------------------------------------------------------ */
function renderCrumbs(d) {
  const last = d.breadcrumbs.length - 1;
  $('#crumbs').innerHTML = d.breadcrumbs.map((c, i) => {
    const label = i === 0 ? `${icon('home', 'w-3.5 h-3.5')}<span>${esc(c.title)}</span>` : `<span class="truncate max-w-[32ch]">${esc(c.title)}</span>`;
    const sep = i ? `<span class="text-zinc-700">${icon('chevron', 'w-3 h-3')}</span>` : '';
    return i === last
      ? `${sep}<span class="inline-flex items-center gap-1.5 text-zinc-200">${label}</span>`
      : `${sep}<a href="${hashFor(c.path)}" class="inline-flex items-center gap-1.5 hover:text-zinc-200 transition">${label}</a>`;
  }).join('');
}

function renderRoot(d) {
  const counts = new Map();
  d.dirs.forEach(x => x.conf.tags.forEach(t => counts.set(t, (counts.get(t) || 0) + 1)));
  const tags = [...counts].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  for (const t of S.activeTags) if (!counts.has(t)) S.activeTags.delete(t);
  const visible = d.dirs.filter(x => [...S.activeTags].every(t => x.conf.tags.includes(t)));
  const pinned = visible.filter(isTop), rest = visible.filter(x => !isTop(x));
  const all = progress('', d.stats.media);
  const last = store.get('last', null);

  let html = `<section class="mb-8 flex flex-col gap-5 lg:flex-row lg:items-end lg:justify-between">
    <div>
      <p class="text-[11px] font-semibold uppercase tracking-[.2em] text-accent-soft/80">${t('library')}</p>
      <h1 class="mt-1 text-3xl sm:text-4xl font-bold tracking-tight text-zinc-50">${esc(d.hub.title)}</h1>
      ${d.conf.description ? `<p class="mt-2 max-w-2xl text-sm text-zinc-400">${esc(d.conf.description)}</p>` : ''}
    </div>
    <div class="grid grid-cols-3 gap-2 sm:gap-3 text-center">
      ${[[d.dirs.length, t('stat_courses')], [d.stats.media, t('stat_lessons')], [d.stats.docs, t('stat_materials')]].map(([n, l]) =>
        `<div class="rounded-xl border border-ink-700 bg-ink-850 px-4 py-2.5"><div class="text-xl font-semibold text-zinc-100 tabular-nums">${n}</div><div class="text-[11px] text-zinc-500">${l}</div></div>`).join('')}
    </div>
  </section>`;

  if (d.stats.media) html += `<div class="mb-8 flex items-center gap-4">
      <div class="flex-1">${progBar('', d.stats.media, 'h-1.5')}</div>
      <span class="text-xs text-zinc-500 tabular-nums" data-prog-label="" data-total="${d.stats.media}">${progText(all)}</span></div>`;

  if (last && last.path) {
    const name = last.path.split('/').pop();
    html += `<a href="${hashFor(last.folder, { play: name })}" class="group mb-8 flex items-center gap-4 rounded-xl border border-accent/25 bg-gradient-to-r from-accent/10 to-transparent p-3 pr-4 hover:border-accent/50 transition">
      <span class="grid place-items-center w-10 h-10 rounded-full bg-accent text-white shadow-lg shadow-accent/30">${icon('play', 'w-4 h-4')}</span>
      <div class="min-w-0 flex-1">
        <div class="text-[11px] uppercase tracking-wider text-accent-soft/90">${t('continue_watching')}</div>
        <div class="truncate text-sm font-medium text-zinc-100">${esc(last.title)}</div>
        <div class="truncate text-xs text-zinc-500">${esc(last.folderTitle || last.folder)}${positions[last.path] ? ` · ${t('stopped_at_l', { t: fmtTime(positions[last.path]) })}` : ''}</div>
      </div>
      <span class="text-zinc-500 group-hover:text-zinc-200">${icon('chevron')}</span></a>`;
  }

  const tools = canWrite() ? `<div class="ml-auto flex gap-2">${folderTools()}
    <button class="btn" data-action="trash-open" title="${t('trash_title')}">${icon('trash', 'w-3.5 h-3.5')}<span class="hidden sm:inline">${t('trash')}</span></button></div>` : '';
  if (tags.length || tools) html += `<div class="mb-8 flex flex-wrap items-center gap-2">
      ${tags.length ? `<span class="mr-1 inline-flex items-center gap-1.5 text-xs text-zinc-500">${icon('tag', 'w-3.5 h-3.5')} ${t('filter')}</span>
      ${tags.map(([t, n]) => tagChip(t, n)).join('')}
      ${S.activeTags.size ? `<button class="ml-1 text-xs text-zinc-400 hover:text-white underline underline-offset-4" data-action="clear-tags">${t('clear')}</button>` : ''}` : ''}
      ${tools}
    </div>`;

  const grid = items => `<div class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3 2xl:grid-cols-4">${items.map(courseCard).join('')}</div>`;
  if (pinned.length) html += section('star', t('s_favs'), pinned.length, grid(pinned));
  if (rest.length) html += section('layers', t(pinned.length ? 's_all' : 's_courses'), rest.length, grid(rest));
  if (!visible.length) html += d.dirs.length
    ? empty(t('no_tag_match'), `<button class="btn mt-4" data-action="clear-tags">${t('clear_filters')}</button>`)
    : empty(t('no_root_folders'), `<code class="mt-2 block text-xs text-zinc-500">${esc(d.hub.root)}</code>`);
  html += fileSections(d);
  $('#app').innerHTML = html;
  paintSel();
}

function folderTools(cls = '') {
  return `<button class="btn ${cls}" data-action="new-folder" title="${t('new_folder_title')}">${icon('folderPlus', 'w-3.5 h-3.5')}<span class="hidden sm:inline">${t('new_folder')}</span></button>
    <button class="btn ${cls} ${S.selecting ? 'is-on' : ''}" data-action="select" title="${t('select_title')}">${icon('checksq', 'w-3.5 h-3.5')}<span class="hidden sm:inline">${t('select')}</span></button>`;
}

function renderFolder(d) {
  const c = d.conf, st = d.stats, p = progress(d.path, st.media), lab = dirLabel(d);
  const last = store.get('last', null);
  let html = '';

  if (d.siblings.length > 1) html += `<nav class="-mx-4 px-4 mb-5 overflow-x-auto no-scrollbar"><div class="flex gap-2 w-max">
    ${favFirst(d.siblings).map(s => { const l = dirLabel(s); return `<a href="${hashFor(s.path)}" class="pill ${s.path === d.path ? 'pill-active' : ''}" title="${esc(s.name)}">
      ${isFav(s.path) ? `<span class="text-amber-300">${icon('starFill', 'w-3 h-3')}</span>` : ''}${l.num ? `<span class="font-mono opacity-60">${esc(l.num)}</span>` : ''}${esc(l.text)}</a>`; }).join('')}</div></nav>`;

  const firstTodo = d.media.findIndex(m => !watched[m.path]);
  const resume = last && last.folder !== d.path && (d.path === '' || last.folder.startsWith(d.path + '/'));
  html += `<header class="relative mb-8 overflow-hidden rounded-2xl border border-ink-700">
    ${cover(d, { monogram: false })}
    <div class="absolute inset-0 bg-gradient-to-r from-ink-950 via-ink-950/85 to-ink-950/40"></div>
    <div class="relative flex min-h-[200px] flex-col justify-end gap-4 p-5 sm:p-8">
      ${canWrite() ? `<div class="absolute top-4 right-4 flex items-center gap-2">
        ${folderTools('bg-black/40 backdrop-blur')}
        <button class="btn bg-black/40 backdrop-blur" data-action="edit-cover" title="${t('edit_cover_title')}">${icon('image', 'w-3.5 h-3.5')}<span class="hidden sm:inline">${t('edit_cover')}</span></button>
        ${kebab(d.path, 'w-8 h-8 rounded-md border border-ink-700 bg-black/40 backdrop-blur hover:bg-ink-700', false)}
      </div>` : ''}
      ${d.parent != null ? `<a href="${hashFor(d.parent)}" class="inline-flex w-max items-center gap-1 text-xs text-zinc-400 hover:text-white">${icon('back', 'w-3.5 h-3.5')} ${t('back')}</a>` : ''}
      <div>
        <h1 class="flex items-baseline gap-3 text-2xl sm:text-3xl font-bold tracking-tight text-zinc-50">
          ${lab.num ? `<span class="font-mono text-lg text-accent-soft/80">${esc(lab.num)}</span>` : ''}<span>${esc(lab.text)}</span>
          ${favBtn(d.path, 'w-8 h-8 self-center hover:bg-white/10', 'w-[18px] h-[18px]')}
          ${c.pinned ? `<span class="text-accent-soft" title="${t('pinned')}">${icon('pin', 'w-4 h-4')}</span>` : ''}</h1>
        ${c.description ? `<p class="mt-2 max-w-3xl text-sm leading-relaxed text-zinc-300/90">${esc(c.description)}</p>` : ''}
      </div>
      ${c.tags.length ? `<div class="flex flex-wrap gap-1.5">${c.tags.map(t => tagChip(t)).join('')}</div>` : ''}
      <div class="flex flex-wrap items-center gap-x-6 gap-y-3">
        ${metaLine(st, 'text-xs', d.path)}
        ${st.media ? `<div class="flex items-center gap-3"><div class="w-40">${progBar(d.path, st.media, 'h-1.5')}</div>
          <span class="text-xs text-zinc-400 tabular-nums" data-prog-label="${esc(d.path)}" data-total="${st.media}">${progText(p)}</span></div>` : ''}
        ${c.status ? statusChip(c, p) : ''}
      </div>
      ${d.media.length || resume ? `<div class="flex flex-wrap gap-2">

    if (d.path !== S.path) return;

    loadDurations(d);
  } catch {}
}

/* Duração das aulas (ffprobe no servidor). Pastas grandes vêm em partes: repete enquanto houver
   "pending". Na raiz só usa o cache, para não medir a biblioteca inteira de uma vez. */
async function loadDurations(d) {
  if (!media().duration) return;
  const seq = S.routeSeq;
  for (let round = 0; round < 50; round++) {
    let r;
    try { r = await api(`/api/durations?path=${enc(d.path)}${d.path ? '' : '&probe=0'}`); } catch { return; }
    if (seq !== S.routeSeq || !S.data || S.data.path !== r.path) return;
    S.dur = r; paintDurations();
    if (!r.pending || !d.path) return;
  }
}
function paintDurations() {
  const r = S.dur;
  if (!r || !r.enabled || !S.data || r.path !== S.data.path) return;
  $$('[data-dur]').forEach(el => { const s = r.files[el.dataset.dur]; el.textContent = s ? fmtTime(s) : ''; });
  $$('[data-dur-dir]').forEach(el => {
    const k = el.dataset.durDir, b = k === r.path ? r.total : r.dirs[k];
    const ok = !!(b && b.count && b.known === b.count && b.seconds > 0);
    el.classList.toggle('hidden', !ok);
    if (ok) el.innerHTML = `${icon('clock', 'w-3.5 h-3.5')}${fmtLong(b.seconds)}`;
  });
}

function renderLoading() {
  $('#app').innerHTML = `<div class="animate-pulse">
    <div class="mb-8 h-40 rounded-2xl bg-ink-850"></div>
    <div class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3">${'<div class="h-64 rounded-xl bg-ink-850"></div>'.repeat(6)}</div></div>`;
}

}

/* ------------------------------------------------------------------ */
/* Roteamento (hash)                                                    */
/* ------------------------------------------------------------------ */
async function route({ force = false } = {}) {
  const { path, params } = parseHash();
  closeModal();
  closeMenu();
  if (S.query) clearSearch();
  if (S.selecting && (force || !S.data || S.data.path !== path)) setSelecting(false);
  if (!force && S.data && S.data.path === path) { applyParams(params); return; }

  closePlayer();
  S.path = path;
  const seq = ++S.routeSeq;
  const slow = setTimeout(renderLoading, 150);
  try {
    const d = await api(`/api/list?path=${enc(path)}`);
    if (seq !== S.routeSeq) return;
    S.data = d;
    if (!path) S.activeTags = new Set((params.get('tag') || '').split(',').filter(Boolean));
    renderView(d);
    if (!force) window.scrollTo(0, 0);
    applyParams(params, true);
    loadDurations(d);
  } catch (e) {
    if (seq === S.routeSeq) { S.data = null; renderError(e); }
  } finally { clearTimeout(slow); }
}

function applyParams(params, fresh = false) {
  const d = S.data; if (!d) return;
  if (!d.path && !fresh) {
    const tags = new Set((params.get('tag') || '').split(',').filter(Boolean));
    if ([...tags].join() !== [...S.activeTags].join()) { S.activeTags = tags; renderRoot(d); }
  }
  const play = params.get('play');
  if (play) {
    const i = d.media.findIndex(m => m.name === play);
    if (i >= 0 && i !== S.playing) openPlayer(i);
  }
  const open = params.get('open');
  if (open) {
    for (const list of ['docs', 'images', 'others', 'media']) {
      const f = d[list].find(x => x.name === open);
      if (f) { history.replaceState(null, '', hashFor(d.path)); previewFile(f); break; }
    }
  }
}

function onTag(tag) {
  if (S.data && !S.data.path) {
    S.activeTags.has(tag) ? S.activeTags.delete(tag) : S.activeTags.add(tag);
    history.replaceState(null, '', hashFor('', S.activeTags.size ? { tag: [...S.activeTags].join(',') } : null));
    renderRoot(S.data);
  } else {
    go('', { tag });
  }
}

function openPlayer(i, { autoplay = true } = {}) {
  const d = S.data, m = d && d.media[i];
  if (!m) return;
  closePlayer();
  S.playing = i;
  const row = $(`[data-row="${i}"]`);
  row.classList.add('is-playing');
  const audio = m.kind === 'audio', tag = audio ? 'audio' : 'video';
  const wrap = document.createElement('div');
  wrap.id = 'player';
  wrap.dataset.path = m.path;
  wrap.className = 'border-t border-ink-700/70 bg-ink-950/60 p-3 sm:p-4';
  wrap.innerHTML = `
    <${tag} id="pv" controls preload="metadata" playsinline${!audio && media().thumbs ? ` poster="/api/thumb?path=${enc(m.path)}"` : ''} class="${audio ? 'w-full' : 'w-full max-h-[72vh] aspect-video rounded-lg bg-black'}">
      ${m.subtitles.map((s, k) => `<track kind="subtitles" src="/api/subtitle?path=${enc(s.path)}" label="${esc(s.label)}" srclang="${esc(s.lang)}"${k === 0 ? ' default' : ''}>`).join('')}
    </${tag}>
    <div id="perr"></div>
    <div class="mt-3 flex flex-wrap items-center gap-2">
      <button class="btn" data-action="prev" ${i === 0 ? 'disabled' : ''}>${icon('prev', 'w-3.5 h-3.5')} ${t('prev')}</button>
      <button class="btn" data-action="next" ${i === d.media.length - 1 ? 'disabled' : ''}>${t('next')} ${icon('next', 'w-3.5 h-3.5')}</button>
      <select class="btn pr-1 cursor-pointer" data-action="rate" title="${t('speed')}">
        ${[0.75, 1, 1.25, 1.5, 1.75, 2].map(r => `<option value="${r}" ${r === prefs.rate ? 'selected' : ''}>${r}x</option>`).join('')}
      </select>
      ${!audio && document.pictureInPictureEnabled ? `<button class="btn" data-action="pip" title="Picture-in-Picture">${icon('pip', 'w-3.5 h-3.5')} PiP</button>` : ''}
      ${!audio ? `<button class="btn" data-action="fullscreen" title="${t('fullscreen')}">${icon('expand', 'w-3.5 h-3.5')} ${t('fullscreen')}</button>` : ''}
      <span class="flex-1"></span>
      <a class="btn" href="${fileUrl(m.path)}" target="_blank" rel="noopener">${icon('external', 'w-3.5 h-3.5')} ${t('new_tab')}</a>
      <a class="btn" href="${fileUrl(m.path, 1)}">${icon('download', 'w-3.5 h-3.5')} ${t('download')}</a>
      <button class="btn" data-action="close-player">${icon('x', 'w-3.5 h-3.5')} ${t('close')}</button>
    </div>`;
  row.appendChild(wrap);

  const v = $('#pv', wrap);
  let lastSave = 0, marked = !!watched[m.path];
  v.addEventListener('loadedmetadata', () => {
    v.playbackRate = prefs.rate;
    const pos = positions[m.path];
    if (pos > 5 && pos < v.duration - 10) { v.currentTime = pos; toast(t('resuming', { t: fmtTime(pos) })); }
  });
  v.addEventListener('timeupdate', () => {
    const now = Date.now();
    if (now - lastSave > 4000) { lastSave = now; savePos(m.path, v.currentTime, v.duration); }
    if (!marked && v.duration && v.currentTime / v.duration >= 0.9) { marked = true; setWatched(m.path, true); }
  });
  v.addEventListener('pause', () => savePos(m.path, v.currentTime, v.duration));
  v.addEventListener('ratechange', () => {
    prefs.rate = v.playbackRate; savePrefs();
    const sel = $('[data-action="rate"]', wrap); if (sel) sel.value = String(v.playbackRate);
  });
  v.addEventListener('ended', () => {
    setWatched(m.path, true);
    delete positions[m.path]; store.set('pos', positions);
    if (prefs.autoplay && i < d.media.length - 1) openPlayer(i + 1);
  });
  v.addEventListener('error', () => {
    if (!v.getAttribute('src')) return;
    $('#perr', wrap).innerHTML = `<div class="mt-3 rounded-lg border border-amber-500/30 bg-amber-500/10 px-3 py-2 text-sm text-amber-200">
      ${t('cant_play')}
      <a class="underline" href="${fileUrl(m.path, 1)}">${t('cant_play_dl')}</a> ${t('cant_play_tail')}</div>`;
  });
  v.src = fileUrl(m.path);
  if (autoplay) v.play().catch(() => {});

  row.scrollIntoView({ behavior: 'smooth', block: 'start' });
  history.replaceState(null, '', hashFor(d.path, { play: m.name }));
  store.set('last', { path: m.path, title: m.title, folder: d.path, folderTitle: d.title, at: Date.now() });
}

function closePlayer({ updateHash = false } = {}) {
  const w = $('#player');
  if (!w) { S.playing = -1; return; }
  const v = $('#pv', w);
  if (v) {
    savePos(w.dataset.path, v.currentTime, v.duration);
    if (document.pictureInPictureElement === v) document.exitPictureInPicture().catch(() => {});
    v.pause(); v.removeAttribute('src'); v.load(); // libera a conexão de streaming
  }
  w.closest('.lesson')?.classList.remove('is-playing');
  w.remove();
  S.playing = -1;
  if (updateHash && S.data) history.replaceState(null, '', hashFor(S.data.path));
}

const LANGS = {
  py: 'python', pyw: 'python', sh: 'bash', bash: 'bash', zsh: 'bash', fish: 'bash',
  asm: 'x86asm', s: 'x86asm', nasm: 'x86asm', inc: 'x86asm', c: 'c', h: 'c', cpp: 'cpp', cc: 'cpp', hpp: 'cpp',
  cs: 'csharp', java: 'java', kt: 'kotlin', go: 'go', rs: 'rust', rb: 'ruby', pl: 'perl', php: 'php', lua: 'lua',
  js: 'javascript', mjs: 'javascript', ts: 'typescript', json: 'json', ipynb: 'json', yaml: 'yaml', yml: 'yaml',
  toml: 'ini', ini: 'ini', cfg: 'ini', conf: 'ini', xml: 'xml', html: 'xml', htm: 'xml', css: 'css', sql: 'sql',
  ps1: 'powershell', psm1: 'powershell', bat: 'dos', cmd: 'dos', md: 'markdown', markdown: 'markdown',
  diff: 'diff', patch: 'diff', makefile: 'makefile',
};
function langFor(name) {
  const e = extOf(name).slice(1) || name.toLowerCase();

}

function openModal({ title, sub = '', body = '', actions = '', size = 'lg' }) {
  const m = $('#modal'), panel = $('#modal-panel');

    ({ full: 'w-[96vw] h-[92vh]', sm: 'w-full max-w-md max-h-[90vh]', md: 'w-full max-w-2xl max-h-[90vh]' }[size] || 'w-full max-w-5xl max-h-[90vh]');
  $('#modal-title').textContent = title;
  $('#modal-sub').textContent = sub;
  $('#modal-actions').innerHTML = actions;
  $('#modal-body').innerHTML = body;
  m.classList.remove('hidden'); m.classList.add('flex');
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  const m = $('#modal');
  if (m.classList.contains('hidden')) return;
  m.classList.add('hidden'); m.classList.remove('flex');
  $('#modal-body').innerHTML = '';
  document.body.style.overflow = '';
  if (S.coverEdit?.blob) URL.revokeObjectURL(S.coverEdit.blob);
  S.coverEdit = null;
  S.formSubmit = null;
  S.picker = null;

}
const modalLinks = f => `
  <a class="ibtn" href="${fileUrl(f.path)}" target="_blank" rel="noopener" title="${t('open_tab')}">${icon('external')}</a>
  <a class="ibtn" href="${fileUrl(f.path, 1)}" title="${t('download')}">${icon('download')}</a>`;

async function previewFile(f) {
  const sub = f.path.split('/').slice(0, -1).join(' / ') || t('home');
  if (f.kind === 'video' || f.kind === 'audio') { go(dirOf(f.path), { play: f.name }); return; }
  if (f.kind === 'image') {
    return openModal({ title: f.name, sub, actions: modalLinks(f), body:
      `<div class="grid h-full place-items-center bg-black/40 p-4"><img src="${fileUrl(f.path)}" alt="${esc(f.name)}" class="max-h-[78vh] max-w-full rounded-lg"></div>` });
  }
  if (f.ext === '.pdf') {
    return openModal({ title: f.name, sub, size: 'full', actions: modalLinks(f),
      body: `<iframe src="${fileUrl(f.path)}" title="${esc(f.name)}" class="h-full w-full border-0 bg-ink-950"></iframe>` });
  }
  if (!f.text) { location.href = fileUrl(f.path, 1); toast(t('downloading')); return; }

  openModal({ title: f.name, sub, actions: `<button class="ibtn" data-action="copy" title="${t('copy_content')}">${icon('copy')}</button>` + modalLinks(f),
    body: `<div class="p-6 text-sm text-zinc-500 animate-pulse">${t('loading')}</div>` });
  try {
    const doc = await api(`/api/text?path=${enc(f.path)}`);
    if ($('#modal-title').textContent !== f.name) return;
    S.modalText = doc.content;
    const warn = doc.truncated ? `<div class="border-b border-amber-500/20 bg-amber-500/10 px-5 py-2 text-xs text-amber-200">${t('truncated', { size: fmtSize(doc.size) })}</div>` : '';
    const lang = langFor(f.name);
    const body = $('#modal-body');
    if (lang === 'markdown' && window.marked && window.DOMPurify) {
      body.innerHTML = warn + `<div class="flex justify-end px-5 pt-3"><button class="btn" data-action="md-toggle">${icon('code', 'w-3.5 h-3.5')} ${t('view_code')}</button></div>
        <article id="md-view" class="prose prose-invert prose-zinc prose-sm sm:prose-base max-w-none px-6 pb-10 pt-1 prose-a:text-accent-soft prose-headings:text-zinc-100">${DOMPurify.sanitize(marked.parse(doc.content))}</article>
        <div id="md-raw" class="hidden">${codeBlock(doc.content, 'markdown')}</div>`;
      fixRelativeLinks($('#md-view'), dirOf(f.path));
      $$('#md-view pre code').forEach(el => window.hljs && hljs.highlightElement(el));
    } else {
      body.innerHTML = warn + codeBlock(doc.content, lang);
    }
    $$('code[data-hl]', body).forEach(el => { if (window.hljs && el.textContent.length < 400000) hljs.highlightElement(el); });
  } catch (e) {
    $('#modal-body').innerHTML = `<div class="p-6 text-sm text-red-300">${esc(e.message)}</div>`;
  }
}
function codeBlock(text, lang) {
  text = text.replace(/\r?\n$/, '');
  const n = text.split('\n').length;
  const nums = Array.from({ length: n }, (_, i) => i + 1).join('\n');
  return `<div class="flex min-w-max font-mono text-[12.5px] leading-6">
    <pre class="sticky left-0 select-none border-r border-ink-700 bg-ink-900 px-3 py-4 text-right text-zinc-600">${nums}</pre>
    <pre class="flex-1 px-4 py-4"><code data-hl class="language-${lang}">${esc(text)}</code></pre></div>`;
}
function fixRelativeLinks(root, base) {
  $$('img[src]', root).forEach(img => {
    const s = img.getAttribute('src');
    if (!/^([a-z]+:|\/|#)/i.test(s)) img.src = fileUrl(joinPath(base, s));
  });
  $$('a[href]', root).forEach(a => {
    const h = a.getAttribute('href');
    if (h.startsWith('#')) return;
    a.target = '_blank'; a.rel = 'noopener';
    if (!/^([a-z]+:|\/)/i.test(h)) a.href = fileUrl(joinPath(base, h));
  });
}

  if (!ce) return;
  if (!/^https?:\/\/[^\s"'<>]+$/i.test(url)) { toast(t('ce_bad_url')); return; }
  Object.assign(ce, { url, file: null, remove: false, src: url });
  paintCoverEditor();
}

async function saveCover() {
  const ce = S.coverEdit;
  if (!ce || ce.busy) return;
  ce.busy = true; paintCoverEditor({ preview: false });
  const q = `?path=${enc(ce.path)}`;
  const patch = body => api('/api/conf' + q, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  try {
    if (ce.file) await api('/api/banner' + q, { method: 'PUT', headers: { 'Content-Type': ce.file.type }, body: ce.file });
    else if (ce.url) await patch({ banner: ce.url });
    else if (ce.remove) await api('/api/banner' + q, { method: 'DELETE' });
    if (!ce.remove && ce.pos !== ce.pos0) await patch({ banner_pos: ce.pos });
    toast(t(ce.remove ? 'ce_removed' : 'ce_updated'));
    route({ force: true });
  } catch (e) {
    toast(t('save_failed', { msg: e.message }));
    if (S.coverEdit === ce) { ce.busy = false; paintCoverEditor({ preview: false }); }
  }
}

/* Organizar: menu ⋯, seleção, criar, renomear, mover, lixeira          */
/* ------------------------------------------------------------------ */
const baseName = p => p.split('/').pop();

function itemFor(path) {
  const d = S.data;
  if (!d) return null;
  if (path === d.path) return { path, name: d.name, kind: 'dir', conf: d.conf };
  const dir = d.dirs.find(x => x.path === path);
  if (dir) return { ...dir, kind: 'dir' };
  for (const list of ['media', 'docs', 'images', 'others']) {
    const f = d[list].find(x => x.path === path);
    if (f) return f;
  }
  return null;
}

function toggleMenu(btn) {
  const m = $('#menu');
  if (!m.classList.contains('hidden') && S.menuPath === btn.dataset.menu) { closeMenu(); return; }
  closeMenu();
  S.menuPath = btn.dataset.menu;
  btn.classList.add('is-open');
  m.innerHTML = [['item-rename', 'pencil', t('rename')], ['item-move', 'move', t('move_to')], ['item-trash', 'trash', t('delete')]]
    .map(([a, ic, label]) => `<button role="menuitem" data-action="${a}" class="flex w-full items-center gap-2.5 rounded-md px-2.5 py-2 text-left text-sm transition
      ${a === 'item-trash' ? 'text-red-300 hover:bg-red-500/10' : 'text-zinc-200 hover:bg-ink-700'}">${icon(ic, 'w-4 h-4')}${label}</button>`).join('');
  m.classList.remove('hidden');
  const r = btn.getBoundingClientRect(), w = m.offsetWidth, h = m.offsetHeight;
  m.style.left = Math.max(8, Math.min(r.right - w, innerWidth - w - 8)) + 'px';
  m.style.top = (r.bottom + h + 8 > innerHeight ? Math.max(8, r.top - h - 4) : r.bottom + 4) + 'px';
  m.querySelector('button').focus({ preventScroll: true });
}
function closeMenu() {
  const m = $('#menu');
  if (m.classList.contains('hidden')) return;
  m.classList.add('hidden');
  $$('.kebab.is-open').forEach(el => el.classList.remove('is-open'));
}

function setSelecting(on) {
  if (on) closePlayer({ updateHash: true });
  S.selecting = on;
  S.sel.clear();
  $('#app').classList.toggle('selecting', on);
  $$('[data-action="select"]').forEach(b => b.classList.toggle('is-on', on));
  paintSel();
}
function toggleSel(path) {
  if (S.sel.has(path)) S.sel.delete(path); else S.sel.add(path);
  paintSel();
}
function paintSel() {
  $$('#app [data-sel]').forEach(el => el.classList.toggle('is-selected', S.sel.has(el.dataset.sel)));
  const bar = $('#selbar'), n = S.sel.size;
  bar.classList.toggle('hidden', !S.selecting);
  bar.classList.toggle('flex', S.selecting);
  if (!S.selecting) return;
  $('#sel-count').textContent = n ? pl(n, 'u_selected') : t('sel_hint');
  $('[data-action="sel-move"]', bar).innerHTML = `${icon('move', 'w-3.5 h-3.5')} ${t('move_to')}`;
  $('[data-action="sel-trash"]', bar).innerHTML = `${icon('trash', 'w-3.5 h-3.5')} ${t('delete')}`;
  $$('[data-needs-sel]', bar).forEach(b => { b.disabled = !n; });
}

// Depois de renomear/mover: migra o progresso e reabre a pasta (ou o novo caminho dela).
function afterMove(moved) {
  migratePaths(moved);
  if (S.selecting) setSelecting(false);
  const cur = S.data ? S.data.path : '';
  const hit = (moved || []).find(m => cur === m.from || cur.startsWith(m.from + '/'));
  if (hit) go(hit.to + cur.slice(hit.from.length)); else route({ force: true });
}

// Modal pequeno com <form id="fs-form">; o submit chama S.formSubmit (erros aparecem em #fs-err).
function openForm({ title, sub = '', inner, confirm, danger = false, onSubmit }) {

function fsTrash(paths) {

  openForm({
    title: t('delete'), sub: paths.length === 1 ? paths[0] : pl(paths.length, 'u_item'),
    confirm: t('trash_confirm'), danger: true,

      <ul class="space-y-1 rounded-lg border border-ink-700 bg-ink-850 px-3 py-2 text-xs text-zinc-400">

      <p class="text-xs text-zinc-500">${t('trash_note')}</p>`,
    onSubmit: async () => {
      closePlayer({ updateHash: true });
      let r;
      try { r = await postJSON('/api/fs/trash', { paths }); }
      catch (e) { if (e.data && e.data.trashed && e.data.trashed.length) route({ force: true }); throw e; }
      if (S.selecting) setSelecting(false);
      toast(t('trashed', { f: r.folder }));
      const cur = S.data ? S.data.path : '';
      const hit = paths.find(p => cur === p || cur.startsWith(p + '/'));
      if (hit) go(dirOf(hit)); else route({ force: true });
    },
  });
}

  openModal({

      <div class="flex gap-2 border-b border-ink-700 p-3">

async function loadPicker(cwd) {
  const pk = S.picker;
  if (!pk) return;
  const seq = ++pk.seq;
  pk.cwd = cwd;
  $('#pk-q').value = '';
  try {
    const tree = await api(`/api/tree?path=${enc(cwd)}`);
    if (S.picker !== pk || seq !== pk.seq) return;
    pk.title = tree.title;
    $('#pk-crumbs').innerHTML = tree.breadcrumbs.map((c, i) =>
      `${i ? `<span class="text-zinc-700">${icon('chevron', 'w-3 h-3')}</span>` : ''}<button class="inline-flex items-center gap-1 rounded px-1 py-0.5 hover:bg-ink-800 hover:text-zinc-200 ${i === tree.breadcrumbs.length - 1 ? 'text-zinc-200' : ''}" data-action="pk-go" data-path="${esc(c.path)}">${i ? '' : icon('home', 'w-3.5 h-3.5')}${esc(c.title)}</button>`).join('');
    renderPickerList(tree.dirs, t('pk_nosub'));
  } catch (e) {
    if (S.picker === pk) $('#pk-list').innerHTML = `<p class="p-6 text-sm text-red-300">${esc(e.message)}</p>`;
  }
  paintPicker();
}

function renderPickerList(dirs, emptyMsg) {
  const pk = S.picker;
  const blocked = p => pk.paths.some(x => p === x || p.startsWith(x + '/'));
  $('#pk-list').innerHTML = dirs.length ? dirs.map(x => `
    <button class="result ${blocked(x.path) ? 'opacity-40 pointer-events-none' : ''}" data-action="pk-go" data-path="${esc(x.path)}">
      <span class="ficon grid place-items-center w-8 h-8 rounded-md shrink-0" style="--h:${hue(x.title)}">${icon('folder', 'w-4 h-4')}</span>
      <span class="min-w-0 flex-1">
        <span class="block truncate text-sm text-zinc-200">${esc(x.title)}</span>
        ${x.where != null ? `<span class="block truncate text-[11px] text-zinc-500">${esc(x.where)}</span>` : ''}
      </span>
      ${x.has_dirs || x.where != null ? `<span class="text-zinc-600">${icon('chevron', 'w-4 h-4')}</span>` : ''}
    </button>`).join('') : `<p class="p-8 text-center text-sm text-zinc-500">${emptyMsg}</p>`;
}

function paintPicker() {
  const pk = S.picker;
  if (!pk) return;
  const inside = pk.paths.some(p => pk.cwd === p || pk.cwd.startsWith(p + '/'));
  const same = pk.paths.every(p => dirOf(p) === pk.cwd);
  const btn = $('[data-action="pk-confirm"]');
  btn.disabled = inside || same || pk.busy;
  $('#pk-msg').className = 'mr-auto text-xs text-zinc-500';
  btn.innerHTML = `${icon('move', 'w-4 h-4')}<span class="truncate">${esc(t('move_to_x', { t: pk.title || t('home') }))}</span>`;
  $('#pk-msg').textContent = inside ? t('pk_inside') : same ? t('pk_same') : '';
}

let pickerTimer;
function onPickerSearch() {
  const pk = S.picker, q = $('#pk-q').value.trim();
  clearTimeout(pickerTimer);
  if (!q) { loadPicker(pk.cwd); return; }
  pickerTimer = setTimeout(async () => {
    const seq = ++pk.seq;

      const r = await api(`/api/search?q=${enc(q)}`);
      if (S.picker !== pk || seq !== pk.seq) return;
      renderPickerList(r.results.filter(x => x.type === 'dir')
        .map(x => ({ ...x, where: x.parent ? x.parent.split('/').join(' › ') : t('home') })), t('pk_none'));

}

async function pickerConfirm() {
  const pk = S.picker;
  if (!pk || pk.busy) return;
  pk.busy = true; paintPicker();
  closePlayer({ updateHash: true });
  try {
    const r = await postJSON('/api/fs/move', { paths: pk.paths, dest: pk.cwd });

    if (S.picker === pk) { pk.busy = false; paintPicker(); $('#pk-msg').textContent = e.message; $('#pk-msg').className = 'mr-auto text-xs text-red-300'; }

function pickerNewFolder() {

  $('#pk-list').insertAdjacentHTML('afterbegin', `<form id="pk-new" class="flex gap-2 p-2" autocomplete="off">

           class="min-w-0 flex-1 h-8 px-2.5 rounded-md bg-ink-850 border border-accent/50 text-xs text-zinc-100 outline-none">
    <button class="btn" type="submit">${t('create')}</button></form>`);
  $('#pk-new-name').focus();

/* --- Lixeira: listar, restaurar, excluir de vez --- */
function stampLabel(stamp) {
  const m = /^(\d{4})-(\d{2})-(\d{2})_(\d{2})(\d{2})(\d{2})$/.exec(stamp);
  if (!m) return stamp;
  const dt = new Date(+m[1], m[2] - 1, +m[3], +m[4], +m[5], +m[6]);
  return dt.toLocaleString(LANG === 'pt' ? 'pt-BR' : 'en', { dateStyle: 'medium', timeStyle: 'short' });
}

function openTrash() {
  closePlayer({ updateHash: true });
  openModal({ title: t('trash'), sub: '.lixeira', size: 'md',
    body: `<div class="p-6 text-sm text-zinc-500 animate-pulse">${t('loading')}</div>` });
  S.trash = { seq: 0, data: null, busy: false, armed: null, timer: 0 };
  loadTrash();
}

async function loadTrash() {
  const tr = S.trash;
  if (!tr) return;
  const seq = ++tr.seq;
  try {
    const r = await api('/api/trash');
    if (S.trash !== tr || seq !== tr.seq) return;
    tr.data = r;
    renderTrash();
  } catch (e) {
    if (S.trash === tr) $('#modal-body').innerHTML = `<p class="p-6 text-sm text-red-300">${esc(e.message)}</p>`;
  }
}

function trashRow(batch, x) {
  const tr = S.trash, armed = tr.armed === batch + '/' + x.path;
  const ext = extOf(x.name);
  const ic = x.kind === 'dir' ? 'folder' : fileIcon({ kind: x.kind, ext, text: false });
  const where = dirOf(x.path) ? dirOf(x.path).split('/').join(' › ') : t('home');
  const meta = [fmtSize(x.size), x.files != null ? pl(x.files, 'u_file') : '', x.subtitles ? t('trash_subs', { n: x.subtitles }) : '']
    .filter(Boolean).join(' · ');
  const ref = `data-batch="${esc(batch)}" data-path="${esc(x.path)}"`;
  return `<div class="flex items-center gap-3 rounded-lg px-2 py-2 hover:bg-ink-800">
    <span class="ficon grid place-items-center w-8 h-8 rounded-md shrink-0" style="--h:${hue(x.kind === 'dir' ? x.name : ext)}">${icon(ic, 'w-4 h-4')}</span>
    <div class="min-w-0 flex-1">
      <div class="truncate text-sm text-zinc-200" title="${esc(x.path)}">${esc(x.name)}</div>
      <div class="truncate text-[11px] text-zinc-500">${esc(where)} · ${meta}</div>
      ${x.conflict ? `<div class="text-[11px] text-amber-300/90">${t('trash_conflict')}</div>` : ''}
    </div>
    <button class="btn" data-action="trash-restore" ${ref} ${x.conflict || tr.busy ? 'disabled' : ''} title="${t('restore')}">${icon('restore', 'w-3.5 h-3.5')}<span class="hidden sm:inline">${t('restore')}</span></button>
    <button class="btn ${armed ? '!border-red-500/60 !bg-red-500/15 text-red-200' : 'text-red-300 hover:text-red-200'}" data-action="trash-del" ${ref} ${tr.busy ? 'disabled' : ''}
      title="${t('del_forever')}">${icon('trash', 'w-3.5 h-3.5')}${armed ? `<span>${t('confirm_q')}</span>` : ''}</button>
  </div>`;
}

function renderTrash() {
  const tr = S.trash, r = tr && tr.data;
  if (!r) return;
  const n = r.batches.reduce((a, b) => a + b.items.length, 0);
  if (!n) { $('#modal-body').innerHTML = `<div class="p-6">${empty(t('trash_is_empty'))}</div>`; return; }
  const armedAll = tr.armed === '*';
  $('#modal-body').innerHTML = `
    <div class="sticky top-0 z-10 flex flex-wrap items-center gap-3 border-b border-ink-700 bg-ink-900 px-4 py-3">
      <p class="mr-auto text-xs text-zinc-400 tabular-nums">${pl(n, 'u_item')} · ${fmtSize(r.size)}</p>
      <button class="btn ${armedAll ? '!border-red-500/60 !bg-red-500/15 text-red-200' : 'text-red-300 hover:text-red-200'}" data-action="trash-empty" ${tr.busy ? 'disabled' : ''}>
        ${icon('trash', 'w-3.5 h-3.5')} ${t(armedAll ? 'confirm_empty' : 'empty_trash')}</button>
    </div>
    <div class="px-2 pb-2">${r.batches.map(b => `
      <div class="px-2 pb-1 pt-4 text-[11px] font-semibold uppercase tracking-wider text-zinc-500">${esc(stampLabel(b.batch))}</div>
      ${b.items.map(x => trashRow(b.batch, x)).join('')}`).join('')}</div>
    <p class="border-t border-ink-700 px-4 py-3 text-xs text-zinc-500">${t('trash_note2')}</p>`;
}

// Excluir de vez pede dois cliques: o primeiro arma o botão por 4 s.
function trashArm(key) {
  const tr = S.trash;
  if (tr.armed === key) return true;
  tr.armed = key;
  clearTimeout(tr.timer);
  tr.timer = setTimeout(() => { if (S.trash === tr && tr.armed === key) { tr.armed = null; renderTrash(); } }, 4000);
  renderTrash();
  return false;
}

async function trashOp(url, body, okMsg, changesLibrary) {
  const tr = S.trash;
  if (!tr || tr.busy) return;
  tr.busy = true; tr.armed = null; clearTimeout(tr.timer); renderTrash();
  try {
    await postJSON(url, body);
    toast(okMsg);
    if (changesLibrary) refreshView();
  } catch (e) {
    toast(e.message);
    if (changesLibrary && e.data && e.data.restored && e.data.restored.length) refreshView();
  }
  if (S.trash === tr) { tr.busy = false; loadTrash(); }
}

/* Busca global                                                         */
/* ------------------------------------------------------------------ */
const qInput = $('#q');
let searchTimer;

function onSearchInput() {
  S.query = qInput.value.trim();
  clearTimeout(searchTimer);
  if (!S.query) { hideSearch(); return; }
  searchTimer = setTimeout(runSearch, 150);
}
async function runSearch() {
  const seq = ++S.searchSeq;
  const scope = S.scopeLocal && S.path ? S.path : '';
  try {
    const r = await api(`/api/search?q=${enc(S.query)}&path=${enc(scope)}`);
    if (seq !== S.searchSeq || !S.query) return;
    S.results = r.results;
    renderSearch(r);
  } catch (e) { toast(t('search_err', { msg: e.message })); }
}
function hideSearch() {
  $('#search-view').classList.add('hidden');
  $('#app').classList.remove('hidden');
  S.results = [];
}
function clearSearch() {
  qInput.value = ''; S.query = ''; clearTimeout(searchTimer); S.searchSeq++;
  hideSearch();
}
function renderSearch(r) {
  const groups = [
    [t('g_folders'), 'folder', x => x.type === 'dir'],
    [t('g_lessons'), 'film', x => x.type === 'video' || x.type === 'audio'],
    [t('g_materials'), 'book', x => x.type === 'doc'],
    [t('g_images'), 'image', x => x.type === 'image'],
    [t('g_others'), 'box', x => x.type === 'other'],
  ];
  const q = S.query;
  let html = `<div class="mb-6 flex flex-wrap items-end justify-between gap-3">
    <div><p class="text-[11px] font-semibold uppercase tracking-[.2em] text-zinc-500">${t('search')}</p>
      <h1 class="mt-1 text-2xl font-semibold text-zinc-100">“${esc(q)}” <span class="text-base font-normal text-zinc-500">${t('results', { n: r.results.length + (r.results.length >= r.limit ? '+' : '') })}</span></h1></div>
    ${S.path ? `<label class="inline-flex items-center gap-2 text-xs text-zinc-400 cursor-pointer select-none">
      <input type="checkbox" data-action="scope" class="accent-[#8b7cf6]" ${S.scopeLocal ? 'checked' : ''}> ${t('only_in')} <b class="font-medium text-zinc-200">${esc(S.data ? S.data.title : S.path)}</b></label>` : ''}
  </div>`;
  if (!r.results.length) html += empty(t('nothing_found'));
  for (const [label, ic, fn] of groups) {
    const items = r.results.map((x, i) => [x, i]).filter(([x]) => fn(x));
    if (!items.length) continue;
    html += section(ic, label, items.length, `<div class="rounded-xl border border-ink-700 bg-ink-850 p-1.5">${items.map(([x, i]) => {
      const where = x.parent ? x.parent.split('/').join(' › ') : t('home');
      const ext = extOf(x.name).slice(1);
      return `<button class="result" data-action="result" data-i="${i}">
        <span class="ficon grid place-items-center w-8 h-8 rounded-md shrink-0" style="--h:${hue(x.type === 'dir' ? x.title : ext)}">${icon(x.type === 'dir' ? 'folder' : fileIcon({ ...x, kind: x.type }), 'w-4 h-4')}</span>
        <span class="min-w-0 flex-1">
          <span class="block truncate text-sm text-zinc-200">${x.num && x.type !== 'dir' ? `<span class="mr-1.5 font-mono text-xs text-zinc-500">${esc(x.num)}</span>` : ''}${hl(x.type === 'dir' || x.type === 'video' || x.type === 'audio' ? x.title : x.name, q)}</span>
          <span class="block truncate text-[11px] text-zinc-500">${esc(where)}</span>
        </span>
        ${x.tags && x.tags.length ? `<span class="hidden md:flex gap-1">${x.tags.slice(0, 4).map(t => `<span class="tag" style="--h:${hue(t)}">${hl(t, q)}</span>`).join('')}</span>` : ''}
        ${ext && x.type !== 'dir' ? `<span class="badge hidden sm:inline-flex">${esc(ext)}</span>` : ''}
      </button>`; }).join('')}</div>`);
  }
  $('#search-view').innerHTML = html;
  $('#app').classList.add('hidden');
  $('#search-view').classList.remove('hidden');
}
function openResult(x) {
  if (!x) return;
  clearSearch();
  if (x.type === 'dir') go(x.path);
  else if (x.type === 'video' || x.type === 'audio') go(x.parent, { play: x.name });
  else go(x.parent, { open: x.name });
}

/* ------------------------------------------------------------------ */
/* Eventos                                                              */
/* ------------------------------------------------------------------ */
async function handleAction(el) {
  const a = el.dataset.action, i = +el.dataset.i, d = S.data;
  const v = $('#pv');
  switch (a) {
    case 'play': if (S.playing === i) closePlayer({ updateHash: true }); else openPlayer(i); break;
    case 'toggle-watched': { const p = d.media[i].path; setWatched(p, !watched[p]); break; }
    case 'mark-all': {
      const all = d.media.every(m => watched[m.path]);
      d.media.forEach(m => { if (all) delete watched[m.path]; else watched[m.path] = Date.now(); });
      store.set('watched', watched); refreshProgressUI();
      toast(t(all ? 'unmarked' : 'all_marked'));
      break;
    }
    case 'continue': { const k = d.media.findIndex(m => !watched[m.path]); openPlayer(k === -1 ? 0 : k); break; }
    case 'prev': if (S.playing > 0) openPlayer(S.playing - 1); break;
    case 'next': if (S.playing < d.media.length - 1) openPlayer(S.playing + 1); break;
    case 'pip': v && v.requestPictureInPicture().catch(e => toast(t('pip_unavail', { msg: e.message }))); break;
    case 'fullscreen': v && (v.requestFullscreen ? v.requestFullscreen() : v.webkitEnterFullscreen?.()); break;
    case 'close-player': closePlayer({ updateHash: true }); break;
    case 'preview': previewFile(d[el.dataset.list][i]); break;
    case 'result': openResult(S.results[i]); break;
    case 'close-modal': closeModal(); break;
    case 'copy':
      try { await navigator.clipboard.writeText(S.modalText); toast(t('copied')); } catch { toast(t('copy_failed')); }
      break;
    case 'md-toggle': {
      const raw = $('#md-raw').classList.toggle('hidden');
      $('#md-view').classList.toggle('hidden', !raw);
      el.innerHTML = raw ? `${icon('code', 'w-3.5 h-3.5')} ${t('view_code')}` : `${icon('eye', 'w-3.5 h-3.5')} ${t('view_rendered')}`;
      break;
    }
    case 'clear-tags':
      S.activeTags.clear(); history.replaceState(null, '', '#/'); renderRoot(d); break;
    case 'edit-cover': openCoverEditor(); break;
    case 'cover-url': setCoverUrl(); break;
    case 'cover-remove':
      if (S.coverEdit) { Object.assign(S.coverEdit, { remove: true, file: null, url: null, src: null }); paintCoverEditor(); }
      break;
    case 'cover-pos-preset': {
      const r = $('#ce-pos');
      if (S.coverEdit && r) { r.value = el.dataset.pos; S.coverEdit.pos = +el.dataset.pos; paintCoverEditor({ preview: false }); }
      break;
    }
    case 'cover-save': saveCover(); break;
    case 'item-rename': case 'item-move': case 'item-trash': {
      const p = S.menuPath, it = itemFor(p);
      closeMenu();
      if (!it) break;
      if (a === 'item-rename') fsRename(it); else if (a === 'item-move') fsMove([p]); else fsTrash([p]);
      break;
    }
    case 'new-folder': if (d) fsNewFolder(d.path, d.title); break;
    case 'select': setSelecting(!S.selecting); break;
    case 'sel-all': $$('#app [data-sel]').forEach(x => S.sel.add(x.dataset.sel)); paintSel(); break;
    case 'sel-move': if (S.sel.size) fsMove([...S.sel]); break;
    case 'sel-trash': if (S.sel.size) fsTrash([...S.sel]); break;
    case 'sel-cancel': setSelecting(false); break;
    case 'pk-go': loadPicker(el.dataset.path); break;
    case 'pk-mkdir': pickerNewFolder(); break;
    case 'pk-confirm': pickerConfirm(); break;
    case 'lang': setLang(LANG === 'pt' ? 'en' : 'pt'); break;
    case 'logout':
      try { await api('/api/logout', { method: 'POST' }); } catch {}
      location.reload();
      break;
    case 'trash-open': openTrash(); break;
    case 'trash-restore': {
      const ref = { batch: el.dataset.batch, path: el.dataset.path };
      trashOp('/api/trash/restore', { items: [ref] }, t('restored', { n: baseName(ref.path) }), true);
      break;
    }
    case 'trash-del': {
      const ref = { batch: el.dataset.batch, path: el.dataset.path };
      if (S.trash && trashArm(ref.batch + '/' + ref.path)) trashOp('/api/trash/delete', { items: [ref] }, t('deleted_forever'), false);
      break;
    }
    case 'trash-empty':
      if (S.trash && trashArm('*')) trashOp('/api/trash/delete', { all: true }, t('trash_emptied'), false);
      break;
    case 'refresh':
      try {
        const r = await api('/api/refresh', { method: 'POST' });
        toast(t('reindexed', { f: r.folders, e: r.entries }));
        route({ force: true });
      } catch (e) { toast(t('reindex_failed', { msg: e.message })); }
      break;
  }
}

document.addEventListener('click', e => {
  if (!e.target.closest('#menu, [data-menu]')) closeMenu();
  if (S.selecting) {                                    // no modo seleção, clicar alterna a seleção
    const s = e.target.closest('#app [data-sel]');
    if (s) { e.preventDefault(); e.stopPropagation(); toggleSel(s.dataset.sel); return; }
  }
  const menuBtn = e.target.closest('[data-menu]');
  if (menuBtn) { e.preventDefault(); e.stopPropagation(); toggleMenu(menuBtn); return; }
  const fav = e.target.closest('[data-fav]');            // antes de a[href]: a estrela fica dentro de links/cards
  if (fav) { e.preventDefault(); e.stopPropagation(); toggleFav(fav.dataset.fav); return; }
  const tag = e.target.closest('[data-tag]');
  if (tag) { e.preventDefault(); e.stopPropagation(); onTag(tag.dataset.tag); return; }
  if (e.target.closest('a[href]')) return;            // links seguem o comportamento padrão
  const act = e.target.closest('[data-action]');
  if (act && !['INPUT', 'SELECT'].includes(act.tagName)) { handleAction(act); return; }
  const nav = e.target.closest('[data-nav]');
  if (nav) go(nav.dataset.nav);
});

document.addEventListener('change', e => {
  const a = e.target.dataset.action;
  if (a === 'autoplay') { prefs.autoplay = e.target.checked; savePrefs(); }
  else if (a === 'rate') { prefs.rate = +e.target.value; savePrefs(); const v = $('#pv'); if (v) v.playbackRate = prefs.rate; }
  else if (a === 'scope') { S.scopeLocal = e.target.checked; runSearch(); }
  else if (a === 'cover-file') { setCoverFile(e.target.files[0]); e.target.value = ''; }
});

document.addEventListener('input', e => {
  if (e.target.dataset.action === 'cover-pos' && S.coverEdit) { S.coverEdit.pos = +e.target.value; paintCoverEditor({ preview: false }); }
  else if (e.target.id === 'pk-q' && S.picker) onPickerSearch();
});

document.addEventListener('submit', async e => {
  const form = e.target;
  if (form.id === 'pk-new') {                           // nova pasta dentro do navegador de pastas
    e.preventDefault();
    const pk = S.picker;
    if (!pk) return;
    try {
      const r = await postJSON('/api/fs/mkdir', { parent: pk.cwd, name: $('#pk-new-name').value });
      toast(t('folder_created'));
      loadPicker(r.path);
    } catch (err) { $('#pk-msg').textContent = err.message; $('#pk-msg').className = 'mr-auto text-xs text-red-300'; }
    return;
  }
  if (form.id !== 'fs-form' || !S.formSubmit) return;
  e.preventDefault();
  const btn = $('button[type="submit"]', form);
  btn.disabled = true;
  $('#fs-err').textContent = '';
  try { await S.formSubmit(); }
  catch (err) { if ($('#fs-err')) { $('#fs-err').textContent = err.message; btn.disabled = false; } }
});

window.addEventListener('scroll', closeMenu, { passive: true });
window.addEventListener('resize', closeMenu);

// Arrastar e soltar / colar imagem enquanto o editor de capa está aberto.
document.addEventListener('dragover', e => {
  if (!S.coverEdit) return;
  e.preventDefault();
  $('#ce-drop')?.classList.add('is-over');
});
document.addEventListener('dragleave', e => { if (!e.relatedTarget) $('#ce-drop')?.classList.remove('is-over'); });
document.addEventListener('drop', e => {
  if (!S.coverEdit) return;
  e.preventDefault();
  $('#ce-drop')?.classList.remove('is-over');
  const f = e.dataTransfer?.files?.[0];
  if (f) setCoverFile(f); else toast(t('ce_drop_file'));
});
document.addEventListener('paste', e => {
  if (!S.coverEdit) return;
  const f = [...(e.clipboardData?.files || [])].find(x => x.type.startsWith('image/'));
  if (f) { e.preventDefault(); setCoverFile(f); }
});

$('#modal').addEventListener('mousedown', e => { if (e.target.id === 'modal') closeModal(); });

qInput.addEventListener('input', onSearchInput);
qInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); openResult(S.results[0]); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); $('#search-view .result')?.focus(); }
  else if (e.key === 'Escape') { clearSearch(); qInput.blur(); }
});

document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName);
  if (e.key === 'Enter' && e.target.id === 'ce-url') { e.preventDefault(); setCoverUrl(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches?.('[data-menu]')) { e.preventDefault(); toggleMenu(e.target); return; }
  if (e.key === 'Escape') {
    if (!$('#menu').classList.contains('hidden')) closeMenu();
    else if (!$('#modal').classList.contains('hidden')) closeModal();
    else if (S.query) clearSearch();
    else if (S.selecting) setSelecting(false);
    return;
  }
  if (!typing && (e.key === '/' || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'))) {
    e.preventDefault(); qInput.focus(); qInput.select(); return;
  }
  const res = document.activeElement?.closest?.('.result');
  if (res && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
    e.preventDefault();
    const all = $$('#search-view .result'), k = all.indexOf(res) + (e.key === 'ArrowDown' ? 1 : -1);
    if (k < 0) qInput.focus(); else all[Math.min(k, all.length - 1)].focus();
  }
  if (e.key === 'Enter' && !typing && document.activeElement?.matches?.('[data-nav]')) go(document.activeElement.dataset.nav);
});

window.addEventListener('hashchange', () => route());
window.addEventListener('pagehide', () => closePlayer());

document.addEventListener('DOMContentLoaded', () => {
  $$('[data-icon]').forEach(el => { el.innerHTML = icon(el.dataset.icon); });
  applyStatic();
  route();
});
</script>
</body>
</html>
